name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build Framework and CLI
        run: swift build -v

      - name: Run Tests
        run: swift test -v

      # The release build is the only path that goes through the Xcode build
      # system, and it rejects things the single-arch native build accepts.
      # Without this step a tag can fail to produce a binary while CI is green.
      - name: Build Release Universal Binary
        run: swift build -c release --arch arm64 --arch x86_64
